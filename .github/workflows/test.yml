name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt check
        shell: bash
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out" 1>&2
            echo "gofmt: above files are not formatted (run 'make fmt')" 1>&2
            exit 1
          fi

      # フェーズ④Step 1: cmd/execsandbox-buildは仕様書§6.3により6環境分の
      # cmd/execsandboxを//go:embedで内包する。埋め込み対象はコミットしない
      # (.gitignore)ため、このパッケージをgo build/go vet/go testする前に
      # 用意しておく必要がある(Makefileの`cross-base`ターゲットと同じ内容。
      # windows-latestは既定シェルがpwshで`VAR=value command`構文を解釈
      # できないため、shell: bashを明示する)。
      - name: build base binaries (for go:embed)
        shell: bash
        run: |
          mkdir -p cmd/execsandbox-build/basebinaries
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_linux_amd64     ./cmd/execsandbox
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_linux_arm64     ./cmd/execsandbox
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_darwin_amd64    ./cmd/execsandbox
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_darwin_arm64    ./cmd/execsandbox
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_windows_amd64.exe ./cmd/execsandbox
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_windows_arm64.exe ./cmd/execsandbox

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test -count=1 ./...

      # フェーズ①Step 5: AF_UNIXでのサンドボックス間通信を3OSで確認する
      # （仕様書§3.1でAF_UNIX一本化を決めた前提が崩れていないかの検証）。
      - name: e2e (sandbox-to-sandbox over AF_UNIX)
        shell: bash
        run: bash tests/e2e_basic.sh

      # フェーズ②Step 7: -t/--timeoutが実際にプロセスを強制終了できることを
      # 3OSで確認する（WithCloseOnContextDoneの挙動がOSに依存しないか）。
      - name: e2e (-t/--timeout force-kill)
        shell: bash
        run: bash tests/e2e_timeout.sh

      # フェーズ②Step 8: -s/-e/"--"引数・-q・--help/-V・不正オプションを
      # 3OSで確認する。
      - name: e2e (policy options and CLI basics)
        shell: bash
        run: bash tests/e2e_policy.sh

      # フェーズ③Step 5: -l/--listenとconn_writeによる外部接続を3OSで
      # 確認する(TCPを使いUnixソケットパスを引数に渡さないことで、
      # windows-latestのGit Bash/MSYSによるパス自動変換を回避している)。
      - name: e2e (external connection)
        shell: bash
        run: bash tests/e2e_conn.sh

  # -raceはcgoを要求するため本体の「pure Go・CGO_ENABLED=0」方針とは別枠で扱う
  # （.claude/rules/testing.md「-raceの運用方針」）。windows-latestにはCコンパイラが
  # 標準で入っていないため対象から外す。
  race:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # フェーズ④Step 1: 上のtestジョブと同じ理由(go:embedの前提)。
      - name: build base binaries (for go:embed)
        shell: bash
        run: |
          mkdir -p cmd/execsandbox-build/basebinaries
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_linux_amd64     ./cmd/execsandbox
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_linux_arm64     ./cmd/execsandbox
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_darwin_amd64    ./cmd/execsandbox
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_darwin_arm64    ./cmd/execsandbox
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_windows_amd64.exe ./cmd/execsandbox
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o cmd/execsandbox-build/basebinaries/execsandbox_windows_arm64.exe ./cmd/execsandbox

      - name: race tests
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
